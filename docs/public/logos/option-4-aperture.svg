  <!-- Crosshair ticks -->
  <line x1="50" y1="8" x2="50" y2="26" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="50" y1="74" x2="50" y2="92" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="8" y1="50" x2="26" y2="50" stroke="#A1A1AA" stroke-width="2.5"/>
  <line x1="74" y1="50" x2="92" y2="50" stroke="#A1A1AA" stroke-width="2.5"/>
  <!-- Diamond core -->
