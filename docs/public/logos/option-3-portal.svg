<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Option 3: Obsidian Gate (Twin architectural pillars + threshold beam) -->
  <rect x="6" y="6" width="88" height="88" rx="18" fill="#08080A" stroke="#27272A" stroke-width="2.5"/>
  <!-- Left Pillar -->
  <path d="M22 22 H40 V78 H22 Z" fill="#FFFFFF"/>
  <!-- Right Pillar -->
  <path d="M60 22 H78 V78 H60 Z" fill="#FFFFFF"/>
  <!-- Top Lintel Arch -->
  <path d="M22 22 H78 V34 H22 Z" fill="#FFFFFF"/>
  <!-- Inner Gate Void -->
  <rect x="40" y="34" width="20" height="44" fill="#08080A"/>
  <!-- Horizontal Threshold / Data Beam piercing the gate -->
  <path d="M13 54 H87" stroke="#08080A" stroke-width="7"/>
  <path d="M14 54 H86" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
  <!-- Subtle base plinth -->
  <rect x="44" y="68" width="12" height="10" fill="#52525B"/>
</svg>
