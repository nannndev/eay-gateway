name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --bin eay-gateway --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/eay-gateway$ext" "dist/eay-gateway-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: eay-gateway-${{ matrix.target }}
          path: dist/*

  macos-universal:
    name: macOS universal + publish
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Universal binary and checksums
        run: |
          cd dist
          lipo -create eay-gateway-aarch64-apple-darwin eay-gateway-x86_64-apple-darwin -output eay-gateway-universal-apple-darwin
          chmod +x eay-gateway-*-darwin eay-gateway-*-linux-gnu
          shasum -a 256 eay-gateway-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
