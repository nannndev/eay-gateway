[workspace]
resolver = "2"
members = ["crates/eay-gateway-core", "crates/eay-gateway"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nannndev/eay-gateway"

[workspace.dependencies]
eay-gateway-core = { path = "crates/eay-gateway-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tempfile = "3.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Production code must not panic on bad input or a broken database; tests may unwrap.
unwrap_used = "warn"
expect_used = "warn"
redundant_clone = "warn"
needless_collect = "warn"
