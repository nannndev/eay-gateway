[package]
name = "eay-gateway"
description = "Local OpenAI-compatible AI gateway: one endpoint for your AI subscriptions and API keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "eay_gateway"
path = "src/lib.rs"

[[bin]]
name = "eay-gateway"
path = "src/main.rs"

[dependencies]
eay-gateway-core.workspace = true
axum = { version = "0.7", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Already in the tree via axum; used to call the router in-process in tests/.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
