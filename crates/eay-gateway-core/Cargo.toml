[package]
name = "eay-gateway-core"
description = "Provider routing, accounts, translators and storage behind eay-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
# rustls instead of the system OpenSSL, so Linux builds are static and run on any distro.
# Native roots honour certificates the user installed (corporate proxies); webpki roots are the
# fallback when the system has none (minimal containers).
reqwest = { version = "0.12", default-features = false, features = [
  "json", "stream", "charset", "http2", "system-proxy",
  "rustls-tls-native-roots", "rustls-tls-webpki-roots",
] }
tokio.workspace = true
rand = "0.8"
chrono = "0.4"
tracing.workspace = true
parking_lot = "0.12"
uuid = { version = "1.8", features = ["v4", "serde"] }
hex = "0.4"
futures.workspace = true
bytes = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
